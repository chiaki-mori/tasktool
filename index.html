<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Edge Task</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1020">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root{
      --bg:#0b1020;
      --bg2:#0f1724;
      --card:#111b2b;
      --accent:#7dd3fc;
      --text:#eaf2fb;
      --muted:#9aa4b2;
      --danger:#fda4af;

      --title-size:28px;
      --item-title-size:24px;
      --item-sub-size:16px;
      --meta-size:16px;

      --radius:16px;
      --pad:14px;
      --gap:12px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

    .app{
      width:100%;height:100%;min-height:520px;
      padding:var(--pad);
      display:flex;flex-direction:column;gap:var(--gap);
      color:var(--text);
      background:linear-gradient(180deg,var(--bg),var(--bg2));
      overflow:hidden;
    }

    header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
    header h1{margin:0;font-size:17px;letter-spacing:.02em}
    .headerRight{display:flex;align-items:center;gap:8px}
    .clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

    button,select,input,textarea{font:inherit}
    button{
      appearance:none;background:rgba(255,255,255,.03);color:var(--text);
      border:1px solid rgba(255,255,255,.12);border-radius:12px;
      min-height:44px;padding:9px 13px;cursor:pointer;touch-action:manipulation;
    }
    button:active{transform:translateY(1px)}
    button.primary{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
    button.danger{border-color:rgba(253,164,175,.45);color:#ffd3d9}
    button.icon{width:44px;padding:0;display:grid;place-items:center;font-size:19px}

    .nowCard{
      flex:0 0 auto;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
      padding:13px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.035)
    }
    .nowText{min-width:0;flex:1}
    .nowTitle{font-size:var(--title-size);font-weight:900;line-height:1.08;overflow-wrap:anywhere}
    .nowMeta{margin-top:7px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
    .nowActions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}

    .listWrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
    .listHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .listLabel{font-size:12px;color:var(--muted)}
    .filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .filters label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;min-height:32px}
    .filters input{width:20px;height:20px}

    .list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:2px;-webkit-overflow-scrolling:touch}
    .empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px}

    .task{
      display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;
      background:rgba(255,255,255,.035);border:2px solid transparent;
      transition:border-color .12s,background .12s,box-shadow .12s
    }
    .task.selected{
      border-color:var(--accent);
      background:color-mix(in srgb,var(--accent) 9%,rgba(255,255,255,.035));
      box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)
    }
    .task.running{
      background:color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.035));
      border-color:color-mix(in srgb,var(--accent) 70%,transparent)
    }
    .task.running .taskTitle{color:var(--accent)}

    .check{
      width:34px;height:34px;flex:0 0 auto;border-radius:11px;border:2px solid rgba(255,255,255,.16);
      display:grid;place-items:center;font-size:19px;font-weight:900;user-select:none;touch-action:manipulation
    }
    .check.done{border-color:transparent;background:#86efac;color:#062418}

    .taskMain{flex:1;min-width:0}
    .selectedBadge{display:none;width:max-content;margin-bottom:5px;padding:3px 7px;border-radius:999px;background:var(--accent);color:#082033;font-size:10px;font-weight:900}
    .task.selected .selectedBadge{display:block}
    .taskTitle{font-size:var(--item-title-size);font-weight:900;line-height:1.12;overflow-wrap:anywhere}
    .taskNote{margin-top:6px;font-size:var(--item-sub-size);line-height:1.35;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
    .taskActions{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}

    .composer{
      flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:12px;
      border-radius:var(--radius);border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035)
    }
    .row{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap}
    .field{
      flex:1 1 260px;min-width:0;min-height:46px;padding:11px 12px;
      border:1px dashed rgba(255,255,255,.16);border-radius:12px;background:rgba(0,0,0,.08);color:var(--text);outline:none
    }
    .field:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)}
    textarea.field{resize:none;min-height:54px;line-height:1.35}
    .memoActions{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}

    .settingsLine{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
    select{min-height:42px;padding:8px 10px;border-radius:11px;background:#152033;color:var(--text);border:1px solid rgba(255,255,255,.12)}

    /* Much larger slider hit area for iPhone */
    .rangeWrap{display:flex;align-items:center;gap:8px;min-height:50px;flex:1 1 260px}
    input[type="range"]{
      appearance:none;-webkit-appearance:none;width:100%;height:46px;background:transparent;margin:0;touch-action:pan-x
    }
    input[type="range"]::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:rgba(255,255,255,.16)}
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;width:32px;height:32px;margin-top:-11px;border-radius:999px;border:3px solid var(--bg);background:var(--accent)
    }
    input[type="range"]::-moz-range-track{height:10px;border-radius:999px;background:rgba(255,255,255,.16)}
    input[type="range"]::-moz-range-thumb{width:32px;height:32px;border-radius:999px;border:3px solid var(--bg);background:var(--accent)}
    .fontValue{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}

    footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
    .saveState{font-variant-numeric:tabular-nums}

    /* Focus mode */
    .focusScreen{display:none;flex:1;min-height:0}
    .app.focus header,.app.focus .nowCard,.app.focus .listWrap,.app.focus .composer,.app.focus footer{display:none}
    .app.focus .focusScreen{display:flex}
    .focusCard{
      width:100%;height:100%;min-height:0;border-radius:20px;border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 12%,var(--bg)),var(--bg2));
      display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:14px;padding:clamp(16px,4vw,34px);overflow:hidden
    }
    .focusMeta{font-size:12px;color:var(--muted)}
    .focusTitle{font-size:clamp(38px,calc(var(--title-size) + 16px),88px);font-weight:1000;line-height:1.03;overflow-wrap:anywhere}
    .focusControls{display:flex;gap:8px;flex-wrap:wrap}
    .focusMemo{
      width:100%;min-height:88px;max-height:30vh;resize:none;padding:12px;border-radius:13px;
      border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.12);color:var(--text);line-height:1.4;font-size:16px
    }

    /* Landscape focus: big task + controls close to it, note still editable */
    @media (orientation:landscape) and (max-height:520px){
      .focusCard{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,.8fr);grid-template-rows:auto 1fr;align-items:center;column-gap:22px;row-gap:8px;padding:18px 24px}
      .focusMain{grid-column:1;grid-row:1 / span 2;align-self:center}
      .focusMeta{margin-bottom:8px}
      .focusTitle{font-size:clamp(42px,8vw,92px)}
      .focusControls{grid-column:2;grid-row:1;align-self:end}
      .focusMemo{grid-column:2;grid-row:2;align-self:start;max-height:45vh;min-height:74px}
    }

    dialog{border:none;padding:0;width:min(92vw,620px);border-radius:18px;background:transparent;color:var(--text)}
    dialog::backdrop{background:rgba(0,0,0,.58)}
    .modal{border-radius:18px;border:1px solid rgba(255,255,255,.1);background:#101827;overflow:hidden}
    .modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.07);font-weight:900}
    .modalBody{padding:14px;display:flex;flex-direction:column;gap:12px}
    .modal textarea{width:100%;min-height:260px;resize:vertical;padding:12px;border-radius:12px;background:rgba(255,255,255,.035);color:var(--text);border:1px solid rgba(255,255,255,.1);line-height:1.5}
    .modalActions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

    .colorRow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
    .colorRow input[type="color"]{width:46px;height:44px;padding:0;border:none;background:transparent}
    .colorRow input[type="text"]{min-height:44px;padding:9px 11px;border-radius:11px;border:1px solid rgba(255,255,255,.13);background:#152033;color:var(--text)}
    .settingHint{font-size:12px;color:var(--muted);line-height:1.4}

    @media (max-width:420px){
      :root{--pad:10px;--gap:9px}
      .nowCard{padding:11px}
      .nowActions button{min-width:70px}
      .task{padding:10px}
      .composer{padding:10px}
      .memoActions{width:100%}
      .memoActions button{flex:1 1 auto}
      footer{display:block}
      .saveState{margin-top:4px}
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>タスクボード</h1>
    <div class="headerRight">
      <div class="clock" id="clock">--:--</div>
      <button class="icon" id="openSettings" aria-label="設定" title="設定">⚙︎</button>
    </div>
  </header>

  <section class="nowCard">
    <div class="nowText">
      <div class="nowTitle" id="nowTitle">いま: （未選択）</div>
      <div class="nowMeta" id="nowMeta">タスクを選んで「開始」を押してください。</div>
    </div>
    <div class="nowActions">
      <button class="primary" id="focusBtn">集中</button>
      <button id="summaryBtn">サマリー</button>
    </div>
  </section>

  <section class="listWrap">
    <div class="listHead">
      <div class="listLabel">タスク一覧</div>
      <div class="filters">
        <label><input type="checkbox" id="todayOnly">今日だけ</label>
        <label><input type="checkbox" id="hideDone">完了を折りたたむ</label>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section class="composer">
    <div class="row">
      <input class="field" id="quickAdd" autocomplete="off" placeholder="新しいタスク（Ctrl + Enter でも追加）">
      <button class="primary" id="addBtn">追加</button>
    </div>

    <div class="row">
      <textarea class="field" id="memoInput" rows="2" placeholder="選択中タスクのメモ"></textarea>
      <div class="memoActions">
        <button id="nowBtn">＋いま</button>
        <button id="tildeBtn">～</button>
        <button class="primary" id="memoSaveBtn">メモ保存</button>
      </div>
    </div>

    <div class="settingsLine">
      <label for="orderSelect">追加順</label>
      <select id="orderSelect">
        <option value="top">新しいタスクが上</option>
        <option value="bottom">新しいタスクが下</option>
      </select>

      <div class="rangeWrap">
        <span>文字</span>
        <input id="fontRange" type="range" min="18" max="84" step="1">
        <span class="fontValue" id="fontValue">28px</span>
      </div>
    </div>
  </section>

  <footer>
    <div><span id="taskCount">0</span>件 / 今日の完了 <span id="doneCount">0</span>件</div>
    <div class="saveState" id="saveState">保存: --</div>
  </footer>

  <section class="focusScreen">
    <div class="focusCard">
      <div class="focusMain">
        <div class="focusMeta">集中モード</div>
        <div class="focusTitle" id="focusTitle">（開始中タスクなし）</div>
      </div>
      <div class="focusControls">
        <button id="focusNowBtn">＋いま</button>
        <button id="focusTildeBtn">～</button>
        <button class="primary" id="focusMemoSaveBtn">メモ保存</button>
        <button id="focusStopBtn">停止</button>
        <button class="primary" id="focusBackBtn">戻る</button>
      </div>
      <textarea class="focusMemo" id="focusMemoInput" placeholder="集中モードでもメモを編集できます"></textarea>
    </div>
  </section>
</div>

<dialog id="summaryDialog">
  <div class="modal">
    <div class="modalHead"><span>今日のサマリー</span><button id="closeSummary">閉じる</button></div>
    <div class="modalBody">
      <textarea id="summaryText" readonly></textarea>
      <div class="modalActions">
        <button id="copySummary" class="primary">コピー</button>
        <button id="downloadSummary">TXT保存</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="settingsDialog">
  <div class="modal">
    <div class="modalHead"><span>見た目の設定</span><button id="closeSettings">閉じる</button></div>
    <div class="modalBody">
      <div class="settingHint">アクセント色</div>
      <div class="colorRow">
        <input id="accentColor" type="color">
        <input id="accentHex" type="text" inputmode="text" placeholder="#7dd3fc">
        <button id="applyAccent">適用</button>
      </div>
      <div class="settingHint">背景色</div>
      <div class="colorRow">
        <input id="bgColor" type="color">
        <input id="bgHex" type="text" inputmode="text" placeholder="#0b1020">
        <button id="applyBg">適用</button>
      </div>
      <div class="modalActions">
        <button id="resetAppearance">見た目を初期化</button>
      </div>
      <div class="settingHint">※ タスクデータは消しません。キャッシュクリアは、原因切り分け前にデータを消す危険があるため今回は入れていません。</div>
    </div>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const STORAGE = {
    tasks: 'edge_tasks',
    selected: 'edge_selected',
    font: 'edge_font',
    order: 'edge_order',
    today: 'edge_today_only',
    hideDone: 'edge_hide_done',
    focus: 'edge_focus',
    quickDraft: 'edge_quick_draft',
    memoDrafts: 'edge_memo_drafts',
    lastSaved: 'edge_last_saved',
    accent: 'edge_accent',
    bg: 'edge_bg'
  };

  function safeJson(key, fallback){
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.warn('Storage parse failed:', key, e);
      return fallback;
    }
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function hm(ts = Date.now()){
    const d = new Date(ts);
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  function ymd(ts = Date.now()){
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function isToday(ts){ return ymd(ts) === ymd(); }
  function fmtMinutes(min){
    const m = Math.max(0, Math.round(min));
    if(m < 60) return `${m}分`;
    return `${Math.floor(m/60)}時間${m%60 ? `${m%60}分` : ''}`;
  }

  let tasks = safeJson(STORAGE.tasks, []);
  let memoDrafts = safeJson(STORAGE.memoDrafts, {});
  let selectedId = localStorage.getItem(STORAGE.selected) || null;

  const app = $('app');
  const quickAdd = $('quickAdd');
  const memoInput = $('memoInput');
  const focusMemoInput = $('focusMemoInput');
  const todayOnly = $('todayOnly');
  const hideDone = $('hideDone');
  const orderSelect = $('orderSelect');
  const fontRange = $('fontRange');

  function persistTasks(){
    localStorage.setItem(STORAGE.tasks, JSON.stringify(tasks));
    localStorage.setItem(STORAGE.selected, selectedId || '');
    const now = Date.now();
    localStorage.setItem(STORAGE.lastSaved, String(now));
    updateSaveState(now);
  }

  function persistDrafts(){
    localStorage.setItem(STORAGE.quickDraft, quickAdd.value || '');
    localStorage.setItem(STORAGE.memoDrafts, JSON.stringify(memoDrafts));
  }

  function updateSaveState(ts){
    const raw = ts || Number(localStorage.getItem(STORAGE.lastSaved));
    $('saveState').textContent = raw ? `保存: ${hm(raw)}` : '保存: --';
  }

  function getTask(id){ return tasks.find(t => t.id === id); }
  function runningTask(){ return tasks.find(t => t.running); }

  function getSelectedDraft(){
    if(!selectedId) return '';
    if(Object.prototype.hasOwnProperty.call(memoDrafts, selectedId)) return memoDrafts[selectedId];
    return getTask(selectedId)?.note || '';
  }

  function setMemoDraft(value){
    if(!selectedId) return;
    memoDrafts[selectedId] = value;
    persistDrafts();
  }

  function selectTask(id){
    selectedId = id;
    localStorage.setItem(STORAGE.selected, selectedId || '');
    const value = getSelectedDraft();
    memoInput.value = value;
    if(app.classList.contains('focus')) focusMemoInput.value = value;
    render();
  }

  function stopTask(task, end = Date.now()){
    if(!task || !task.running) return;
    task.running = false;
    const log = [...(task.logs || [])].reverse().find(x => !x.end);
    if(log) log.end = end;
  }

  function stopOthers(exceptId){
    tasks.forEach(t => { if(t.running && t.id !== exceptId) stopTask(t); });
  }

  function toggleRun(id){
    const task = getTask(id);
    if(!task) return;
    if(task.running){
      stopTask(task);
    } else {
      stopOthers(id);
      task.running = true;
      task.logs = Array.isArray(task.logs) ? task.logs : [];
      task.logs.push({start:Date.now(), end:null});
      selectedId = id;
      memoInput.value = getSelectedDraft();
    }
    persistTasks();
    render();
  }

  function toggleDone(id){
    const task = getTask(id);
    if(!task) return;
    task.done = !task.done;
    if(task.done) stopTask(task); // requirement: checking automatically stops it
    persistTasks();
    render();
  }

  function deleteTask(id){
    const task = getTask(id);
    if(!task) return;
    if(!confirm(`このタスクを削除しますか？\n\n${task.title}`)) return;
    stopTask(task);
    tasks = tasks.filter(t => t.id !== id);
    delete memoDrafts[id];
    if(selectedId === id) selectedId = null;
    persistDrafts();
    persistTasks();
    memoInput.value = '';
    render();
  }

  function addTask(){
    const title = quickAdd.value.trim();
    if(!title) return;
    const task = {id:`id${Date.now()}_${Math.random().toString(36).slice(2,7)}`,title,note:'',done:false,created:Date.now(),running:false,logs:[]};
    tasks.push(task);
    quickAdd.value = '';
    localStorage.setItem(STORAGE.quickDraft, '');
    selectedId = task.id;
    memoInput.value = '';
    persistTasks();
    render();
  }

  function saveMemoFrom(input){
    if(!selectedId) return alert('先にタスクを選んでください');
    const task = getTask(selectedId);
    if(!task) return;
    task.note = input.value;
    memoDrafts[selectedId] = input.value;
    persistDrafts();
    persistTasks();
    memoInput.value = input.value;
    focusMemoInput.value = input.value;
    render();
  }

  function insertAtCursor(input, text){
    const start = Number.isInteger(input.selectionStart) ? input.selectionStart : input.value.length;
    const end = Number.isInteger(input.selectionEnd) ? input.selectionEnd : start;
    input.value = input.value.slice(0,start) + text + input.value.slice(end);
    const pos = start + text.length;
    input.focus();
    try { input.setSelectionRange(pos,pos); } catch(e) {}
    if(input === memoInput || input === focusMemoInput) setMemoDraft(input.value);
  }

  function visibleTasks(){
    let arr = tasks.slice();
    if(todayOnly.checked) arr = arr.filter(t => isToday(t.created));
    if(hideDone.checked) arr = arr.filter(t => !t.done);
    const newestFirst = orderSelect.value === 'top';
    arr.sort((a,b) => newestFirst ? b.created-a.created : a.created-b.created);
    return arr;
  }

  function taskMinutes(task, endNow = Date.now()){
    return (task.logs || []).reduce((sum,log) => {
      if(!log.start) return sum;
      const end = log.end || endNow;
      return sum + Math.max(0,(end-log.start)/60000);
    },0);
  }

  function render(){
    const list = $('list');
    const shown = visibleTasks();
    list.innerHTML = '';

    if(!shown.length){
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '表示するタスクがありません';
      list.appendChild(e);
    }

    shown.forEach(task => {
      const el = document.createElement('div');
      el.className = `task${task.id===selectedId?' selected':''}${task.running?' running':''}`;

      const check = document.createElement('div');
      check.className = `check${task.done?' done':''}`;
      check.textContent = task.done ? '✓' : '';
      check.onclick = (ev) => { ev.stopPropagation(); toggleDone(task.id); };

      const main = document.createElement('div');
      main.className = 'taskMain';
      const badge = document.createElement('div');
      badge.className = 'selectedBadge';
      badge.textContent = '選択中';
      const title = document.createElement('div');
      title.className = 'taskTitle';
      title.textContent = task.title;
      const note = document.createElement('div');
      note.className = 'taskNote';
      note.textContent = task.note || '';
      main.append(badge,title,note);

      const actions = document.createElement('div');
      actions.className = 'taskActions';
      const run = document.createElement('button');
      run.className = 'primary';
      run.textContent = task.running ? '停止' : '開始';
      run.onclick = (ev) => { ev.stopPropagation(); toggleRun(task.id); };
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '削除';
      del.onclick = (ev) => { ev.stopPropagation(); deleteTask(task.id); };
      actions.append(run,del);

      el.append(check,main,actions);
      el.onclick = () => selectTask(task.id);
      list.appendChild(el);
    });

    $('taskCount').textContent = tasks.length;
    $('doneCount').textContent = tasks.filter(t => t.done && isToday(t.created)).length;

    const run = runningTask();
    if(run){
      $('nowTitle').textContent = `いま: ${run.title}`;
      $('nowMeta').textContent = run.note ? `メモ: ${run.note}` : `開始 ${hm((run.logs||[]).slice(-1)[0]?.start || Date.now())}`;
    } else if(selectedId && getTask(selectedId)) {
      $('nowTitle').textContent = `選択中: ${getTask(selectedId).title}`;
      $('nowMeta').textContent = '「開始」を押すと進行中になります。';
    } else {
      $('nowTitle').textContent = 'いま: （未選択）';
      $('nowMeta').textContent = 'タスクを選んで「開始」を押してください。';
    }

    if(selectedId){
      const value = getSelectedDraft();
      if(document.activeElement !== memoInput) memoInput.value = value;
    }

    updateFocus();
  }

  function updateFocus(){
    const run = runningTask();
    $('focusTitle').textContent = run ? run.title : '（開始中タスクなし）';
    $('focusStopBtn').disabled = !run;
    if(run){
      if(selectedId !== run.id){
        selectedId = run.id;
        localStorage.setItem(STORAGE.selected, selectedId);
      }
      if(document.activeElement !== focusMemoInput) focusMemoInput.value = getSelectedDraft();
    } else {
      if(document.activeElement !== focusMemoInput) focusMemoInput.value = '';
    }
  }

  function setFocus(on){
    app.classList.toggle('focus', on);
    localStorage.setItem(STORAGE.focus, on ? '1':'0');
    updateFocus();
  }

  function applyFont(size){
    const n = Math.max(18,Math.min(84,Number(size)||28));
    document.documentElement.style.setProperty('--title-size', `${n}px`);
    document.documentElement.style.setProperty('--item-title-size', `${Math.max(18,n-4)}px`);
    document.documentElement.style.setProperty('--item-sub-size', `${Math.max(14,n-12)}px`);
    document.documentElement.style.setProperty('--meta-size', `${Math.max(14,n-10)}px`);
    fontRange.value = String(n);
    $('fontValue').textContent = `${n}px`;
    localStorage.setItem(STORAGE.font,String(n));
  }

  function normalizeHex(v){
    if(!v) return null;
    let s = String(v).trim();
    if(!s.startsWith('#')) s = `#${s}`;
    return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toLowerCase() : null;
  }
  function applyAccent(hex){
    const h = normalizeHex(hex);
    if(!h) return false;
    document.documentElement.style.setProperty('--accent',h);
    $('accentColor').value = h;
    $('accentHex').value = h;
    localStorage.setItem(STORAGE.accent,h);
    return true;
  }
  function applyBg(hex){
    const h = normalizeHex(hex);
    if(!h) return false;
    document.documentElement.style.setProperty('--bg',h);
    $('bgColor').value = h;
    $('bgHex').value = h;
    localStorage.setItem(STORAGE.bg,h);
    return true;
  }

  function buildSummary(){
    const todays = tasks.filter(t => isToday(t.created));
    const totalMin = todays.reduce((sum,t) => sum + taskMinutes(t),0);
    const lines = [];
    lines.push(`【${ymd()} 作業サマリー】`);
    lines.push(`合計 ${todays.length}件 / 完了 ${todays.filter(t=>t.done).length}件 / 未完了 ${todays.filter(t=>!t.done).length}件`);
    lines.push('');

    if(totalMin > 0){
      lines.push('■ 作業時間・割合');
      todays.filter(t => taskMinutes(t)>0).sort((a,b)=>taskMinutes(b)-taskMinutes(a)).forEach(t => {
        const min = taskMinutes(t);
        const pct = Math.round((min/totalMin)*100);
        lines.push(`- ${t.title}: ${fmtMinutes(min)} / ${pct}%`);
      });
      lines.push(`合計: ${fmtMinutes(totalMin)}`);
      lines.push('');
    }

    const run = runningTask();
    if(run){
      lines.push('■ いま（進行中）');
      lines.push(`- ${run.title}${run.note ? `（${run.note}）` : ''}`);
      lines.push('');
    }

    const undone = todays.filter(t=>!t.done);
    if(undone.length){
      lines.push('■ 未完了');
      undone.forEach((t,i)=>lines.push(`${i+1}. ${t.title}${t.note ? `（${t.note}）` : ''}`));
      lines.push('');
    }

    const done = todays.filter(t=>t.done);
    if(done.length){
      lines.push('■ 完了');
      done.forEach((t,i)=>lines.push(`${i+1}. ${t.title}${t.note ? `（${t.note}）` : ''}`));
    }
    return lines.join('\n');
  }

  // Init settings + drafts
  quickAdd.value = localStorage.getItem(STORAGE.quickDraft) || '';
  todayOnly.checked = localStorage.getItem(STORAGE.today) === '1';
  hideDone.checked = localStorage.getItem(STORAGE.hideDone) !== '0';
  orderSelect.value = localStorage.getItem(STORAGE.order) || 'bottom';
  applyFont(localStorage.getItem(STORAGE.font) || 28);
  applyAccent(localStorage.getItem(STORAGE.accent) || '#7dd3fc');
  applyBg(localStorage.getItem(STORAGE.bg) || '#0b1020');
  updateSaveState();

  // Clock
  function tick(){ $('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
  tick();
  setInterval(tick,1000);

  // Regular UI events
  $('addBtn').onclick = addTask;
  quickAdd.addEventListener('input',() => localStorage.setItem(STORAGE.quickDraft,quickAdd.value));
  memoInput.addEventListener('input',() => setMemoDraft(memoInput.value));
  $('memoSaveBtn').onclick = () => saveMemoFrom(memoInput);
  $('nowBtn').onclick = () => insertAtCursor(memoInput,hm());
  $('tildeBtn').onclick = () => insertAtCursor(memoInput,'～');

  todayOnly.onchange = () => { localStorage.setItem(STORAGE.today,todayOnly.checked?'1':'0'); render(); };
  hideDone.onchange = () => { localStorage.setItem(STORAGE.hideDone,hideDone.checked?'1':'0'); render(); };
  orderSelect.onchange = () => { localStorage.setItem(STORAGE.order,orderSelect.value); render(); };
  fontRange.oninput = () => applyFont(fontRange.value);

  $('focusBtn').onclick = () => setFocus(true);
  $('focusBackBtn').onclick = () => setFocus(false);
  $('focusStopBtn').onclick = () => { const r=runningTask(); if(r) toggleRun(r.id); };
  focusMemoInput.addEventListener('input',() => setMemoDraft(focusMemoInput.value));
  $('focusMemoSaveBtn').onclick = () => saveMemoFrom(focusMemoInput);
  $('focusNowBtn').onclick = () => insertAtCursor(focusMemoInput,hm());
  $('focusTildeBtn').onclick = () => insertAtCursor(focusMemoInput,'～');

  // Summary
  const summaryDialog = $('summaryDialog');
  $('summaryBtn').onclick = () => { $('summaryText').value = buildSummary(); summaryDialog.showModal(); };
  $('closeSummary').onclick = () => summaryDialog.close();
  $('copySummary').onclick = async () => {
    try { await navigator.clipboard.writeText($('summaryText').value); alert('サマリーをコピーしました'); }
    catch(e){ $('summaryText').select(); document.execCommand('copy'); alert('サマリーをコピーしました'); }
  };
  $('downloadSummary').onclick = () => {
    const blob = new Blob([$('summaryText').value],{type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `edge-summary-${ymd()}.txt`; a.click(); URL.revokeObjectURL(url);
  };

  // Appearance settings
  const settingsDialog = $('settingsDialog');
  $('openSettings').onclick = () => settingsDialog.showModal();
  $('closeSettings').onclick = () => settingsDialog.close();
  $('accentColor').oninput = () => $('accentHex').value = $('accentColor').value;
  $('bgColor').oninput = () => $('bgHex').value = $('bgColor').value;
  $('applyAccent').onclick = () => { if(!applyAccent($('accentHex').value)) alert('例: #7dd3fc の形式で入力してください'); };
  $('applyBg').onclick = () => { if(!applyBg($('bgHex').value)) alert('例: #0b1020 の形式で入力してください'); };
  $('resetAppearance').onclick = () => {
    localStorage.removeItem(STORAGE.accent); localStorage.removeItem(STORAGE.bg); localStorage.removeItem(STORAGE.font);
    applyAccent('#7dd3fc'); applyBg('#0b1020'); applyFont(28);
  };

  // Ctrl/Cmd + Enter task add. If task field is empty, focus it instead.
  document.addEventListener('keydown',(e) => {
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      if(quickAdd.value.trim()) addTask(); else quickAdd.focus();
      return;
    }
    if(e.key === 'Escape'){
      if(summaryDialog.open) summaryDialog.close();
      if(settingsDialog.open) settingsDialog.close();
      if(app.classList.contains('focus')) setFocus(false);
    }
  });

  // Preserve unsaved drafts when the PWA goes to background.
  document.addEventListener('visibilitychange',() => { if(document.hidden) persistDrafts(); });
  window.addEventListener('pagehide',persistDrafts);

  render();
  if(localStorage.getItem(STORAGE.focus) === '1') setFocus(true);
})();
</script>
</body>
</html>
